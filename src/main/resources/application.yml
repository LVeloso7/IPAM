spring:
  application:
    name: ipam
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/ipam
    username: ipam
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    user:
      name: ${IPAM_DEV_USER}
      password: ${IPAM_DEV_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health